name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/zenith-hub/src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build frontend sub-applications
        run: npm run build:all

      - name: Build Tauri Desktop Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Zenith Pre-Alpha ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: true
          projectPath: './apps/zenith-hub'

      - name: Generate and Publish updater.json
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"
          $Version = $Tag.TrimStart('v').TrimStart('V')
          
          # Find latest.json generated by Tauri v2
          $LatestJson = Get-ChildItem -Path "./apps/zenith-hub/src-tauri/target" -Recurse -Filter "latest.json" | Select-Object -First 1
          
          if (-not $LatestJson) {
            Write-Warning "Could not find tauri-generated latest.json file. Skipping updater.json generation."
            exit 0
          }
          
          Copy-Item -Path $LatestJson.FullName -Destination "./updater.json" -Force
          Write-Host "Copied latest.json successfully to updater.json for version $Version"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config http.sslVerify false
          git checkout main
          git pull origin main
          git add updater.json
          git commit -m "chore: update updater.json to version $Version [skip ci]"
          git push origin main
